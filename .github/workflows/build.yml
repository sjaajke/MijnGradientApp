name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'

jobs:

  # ─────────────────────────────────────────────
  # macOS
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Flutter installeren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: App inpakken als zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r MijnGradientApp-macOS.zip *.app

      - name: Artifact uploaden
        uses: actions/upload-artifact@v4
        with:
          name: MijnGradientApp-macOS
          path: build/macos/Build/Products/Release/MijnGradientApp-macOS.zip
          retention-days: 14

  # ─────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter installeren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Artifact inpakken
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath MijnGradientApp-Windows.zip

      - name: Artifact uploaden
        uses: actions/upload-artifact@v4
        with:
          name: MijnGradientApp-Windows
          path: MijnGradientApp-Windows.zip
          retention-days: 14

  # ─────────────────────────────────────────────
  # Android (debug signing — geen keystore nodig)
  # ─────────────────────────────────────────────
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter installeren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Artifacts uploaden
        uses: actions/upload-artifact@v4
        with:
          name: MijnGradientApp-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ─────────────────────────────────────────────
  # iOS (geen codesigning)
  # ─────────────────────────────────────────────
  build-ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Flutter installeren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Build iOS (zonder codesign)
        run: flutter build ios --release --no-codesign

      - name: Artifact inpakken als zip
        run: |
          zip -r MijnGradientApp-iOS-unsigned.zip \
            build/ios/iphoneos/Runner.app

      - name: Artifact uploaden
        uses: actions/upload-artifact@v4
        with:
          name: MijnGradientApp-iOS-unsigned
          path: MijnGradientApp-iOS-unsigned.zip
          retention-days: 14

  # ─────────────────────────────────────────────
  # GitHub Pages publiceren (altijd, bij elke push naar main)
  # ─────────────────────────────────────────────
  deploy-pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Docs uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # Release aanmaken bij tag-push
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artifacts downloaden
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Release aanmaken
        uses: softprops/action-gh-release@v2
        with:
          name: "MijnGradientApp ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: artifacts/**/*
          body: |
            ## MijnGradientApp ${{ github.ref_name }}

            | Platform | Bestand |
            |----------|---------|
            | macOS    | `MijnGradientApp-macOS.zip` |
            | Windows  | `MijnGradientApp-Windows.zip` |
            | Android  | `app-release.apk` + `app-release.aab` |
            | iOS      | `MijnGradientApp-iOS-unsigned.zip` (xcarchive, niet gesigneerd) |
